<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание занятий</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="style.css">
<script>
/* Выбранная тема применяется до отрисовки — иначе на тёмной теме
   мелькнёт белый экран. Три строки, поэтому прямо здесь, а не в app.js. */
try {
  var t = localStorage.getItem('theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch (e) { /* приватный режим — просто идём по настройке системы */ }
</script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <!-- Название колледжа и адрес его сайта берутся из site.txt — ссылку
         на герб проставляет app.js. Сам герб подставляется из style.css:
         gerb-w.png для светлой темы, gerb-b.png для тёмной.
         Скачивается только подходящий. -->
    <a class="badge" aria-hidden="true"></a>
    <div class="top__text">
      <p class="eyebrow" id="eyebrow">Учебный отдел</p>
      <h1 id="title">Расписание занятий</h1>
      <span id="stamps"></span>
    </div>

    <button class="theme" id="theme" type="button" data-icon="moon" aria-label="Тёмная тема">
      <svg class="theme__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.7 6.7 0 0 0 9.5 9.5z"/>
      </svg>
      <svg class="theme__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <button class="back" id="back" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 5l-7 7 7 7"/>
    </svg>
    Назад
  </button>

  <nav class="picker" aria-label="Выбор расписания">
    <details class="drop" name="picker" id="drop-t">
      <summary>
        <span class="field__label">Преподаватель</span>
        <span class="drop__value">Не выбрано</span>
      </summary>
      <div class="drop__panel">
        <input type="search" class="drop__search" placeholder="Фамилия" aria-label="Поиск преподавателя">
        <ul class="drop__list"></ul>
      </div>
    </details>

    <p class="divider">или</p>

    <details class="drop" name="picker" id="drop-s">
      <summary>
        <span class="field__label">Группа</span>
        <span class="drop__value">Не выбрано</span>
      </summary>
      <div class="drop__panel">
        <input type="search" class="drop__search" placeholder="Название" aria-label="Поиск группы">
        <ul class="drop__list"></ul>
      </div>
    </details>
  </nav>

  <main class="schedule" id="schedule">
    <p class="free free--week">Загрузка…</p>
  </main>

  <footer class="foot" id="foot"></footer>

  <noscript>
    <p class="free free--week">Для показа расписания нужен JavaScript.
      Файлы доступны напрямую: <a href="t/">t/</a> — преподаватели, <a href="s/">s/</a> — группы.</p>
  </noscript>

</div>
<script src="app.js" defer></script>
</body>
</html>
